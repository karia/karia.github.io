<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>karia</title>
<meta name="description" content="karia (Yoshiyuki Hisamatsu)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #1B3BA8;
    --ink: #F2F4F8;
    --sub: #A9B8EA;
    --gutter: clamp(16px, 5vw, 64px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--field); color: var(--ink); }
  body {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--gutter);
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 500;
  }
  h1 {
    font-family: "Dela Gothic One", sans-serif;
    font-weight: 400;
    font-size: clamp(4.5rem, 30vw, 24rem);
    line-height: .8;
    letter-spacing: -.03em;
    margin-left: -.04em;
  }
  .fullname {
    margin-top: 1.25rem;
    color: var(--sub);
    font-size: clamp(1rem, 2.2vw, 1.375rem);
    letter-spacing: .02em;
  }
  ul { grid-row: 3; list-style: none; }
  li + li { margin-top: .35em; }
  a {
    color: var(--ink);
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    text-decoration: underline;
    text-decoration-thickness: .06em;
    text-underline-offset: .18em;
    text-decoration-color: transparent;
    transition: text-decoration-color .15s;
  }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>karia</h1>
    <p class="fullname">Yoshiyuki Hisamatsu</p>
  </header>
  <ul>
    <li><a href="https://github.com/karia" rel="me">GitHub</a></li>
    <li><a href="https://x.com/karia2nd" rel="me">X</a></li>
    <li><a href="https://karia.hatenablog.jp/" rel="me">はてなブログ</a></li>
  </ul>
</body>
</html>
