<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>karia</title>
<meta name="description" content="karia (Yoshiyuki Hisamatsu)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEEEEC;
    --ink: #1E1E1E;
    --sub: #666664;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 16px;
    font-family: "Courier Prime", "Courier New", monospace;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  main { width: min(100%, 22rem); }
  h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
  .fullname { color: var(--sub); }
  ul { list-style: none; margin-top: 2rem; }
  a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: .2em;
    text-decoration-color: transparent;
    transition: text-decoration-color .15s;
  }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
  <main>
    <h1>karia</h1>
    <p class="fullname">Yoshiyuki Hisamatsu</p>
    <ul>
      <li><a href="https://github.com/karia" rel="me">GitHub</a></li>
      <li><a href="https://x.com/karia2nd" rel="me">X</a></li>
      <li><a href="https://zenn.dev/karia" rel="me">Zenn</a></li>
      <li><a href="https://karia.hatenablog.jp/" rel="me">Hatena Blog</a></li>
      <li><a href="https://speakerdeck.com/karia" rel="me">Speaker Deck</a></li>
      <li><a href="https://github.com/karia/resume/blob/main/resume.md">Resume</a></li>
    </ul>
  </main>
</body>
</html>
